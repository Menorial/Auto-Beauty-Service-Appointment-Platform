server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: auto-beauty-backend

  datasource:
    # 全部通过环境变量注入，仓库里不留任何真实凭据
    url: "${DB_URL:jdbc:mysql://localhost:3306/auto_beauty?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 解决 Spring Boot 2.7+ 与 SpringFox 兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# JWT配置
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-in-production}
  expiration: ${JWT_EXPIRATION:86400000} # 24小时

# 文件上传配置
file:
  upload:
    path: ./uploads/
    avatar-path: ./uploads/avatars/
    vehicle-path: ./uploads/vehicles/
    service-path: ./uploads/services/
    review-path: ./uploads/reviews/

# 支付配置
payment:
  # 支付宝沙箱配置
  alipay:
    # 应用ID（留空则支付功能不可用，不影响其余模块）
    app-id: ${ALIPAY_APP_ID:}
    # 支付宝公钥
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    # 应用私钥
    merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
    # 沙箱网关
    gateway-url: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    # 返回格式
    format: json
    # 字符集
    charset: utf-8
    # 签名类型
    sign-type: RSA2
    # 异步回调地址（本地调试可用 ngrok 映射，见 README）
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8081/api/payment/alipay/notify}
    # 同步返回地址
    return-url: ${ALIPAY_RETURN_URL:http://localhost:8080/payment/result}

# 日志配置
logging:
  level:
    com.autobeauty: ${LOG_LEVEL:DEBUG}
    org.springframework.security: ${LOG_LEVEL:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger配置
springfox:
  documentation:
    swagger-ui:
      base-url: /swagger-ui
